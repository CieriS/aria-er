[package]
name = "aq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aq-ingest"
path = "src/main.rs"

[features]
# Lets `sink.storage = "gcs"` write the raw layer to Google Cloud Storage.
gcs = ["aq-sink-parquet/gcs"]

[dependencies]
anyhow = "1"
aq-core.workspace = true
aq-http.workspace = true
aq-sink-parquet.workspace = true
aq-source-arpae.workspace = true
aq-source-openmeteo.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
toml = "1.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
tempfile.workspace = true
