# aq-ingest configuration.
# Every value can be overridden with an environment variable named
# AQ_<SECTION>__<KEY>, e.g. AQ_RUN__REPROCESS_WINDOW_DAYS=45.

[arpae]
# Measurement archive of the ARPAE REST service: hourly and daily values from late 2021,
# first published a few hours after measurement and revised as they are validated.
measurements_url = "https://apps.arpae.it/REST/qa_archivio_dati_public"
stations_csv_url = "https://docs.google.com/spreadsheets/d/1-4wgZ8JeLeg0bODTSFUrshPY-_y9mERUu0FJtSFr78s/export?format=csv"
# Station registry carrying the type of each station (traffic, background, industrial).
station_types_url = "https://apps.arpae.it/REST/qa_stazioni"
# Validated yearly files downloaded from the ARPAE archive, read by `aq-ingest archive`.
archive_dir = "data/samples/arpae"
# Published timestamps do not follow daylight saving: assumed UTC+1 all year.
utc_offset_hours = 1
# Larger pages are cut off by the server more often (5000 records are about 3.5 MB).
page_size = 2000
# Pollutants published as daily means (PM10, PM2.5), by id of the parameter registry.
# The archive stamps them at the end of their day and hourly values at the start of
# their hour; the ingestor stores the day itself and the end of the hour.
daily_pollutant_ids = [5, 111]

# The measurement archive has its own ids. Parameter id of the archive = id of the ARPAE
# parameter registry, the one used in the raw layer and in the dbt seed `arpae_pollutants`.
# Only the parameters listed here are requested (ethylbenzene, 41, and m,p-xylene, 45,
# have no registry id).
[arpae.pollutant_ids]
29 = 1    # SO2
30 = 9    # NOx
31 = 38   # NO
32 = 8    # NO2
33 = 10   # CO
34 = 7    # O3
38 = 20   # Benzene
39 = 21   # Toluene
42 = 82   # o-xylene
48 = 111  # PM2.5
50 = 5    # PM10

