[openmeteo]
archive_url = "https://archive-api.open-meteo.com/v1/archive"
# Station coordinates rounded to this many decimals share one weather location
# (1 decimal is ~11 km, the order of the archive grid). Must match the dbt
# variable `weather_coordinate_decimals`.
coordinate_decimals = 1
max_locations_per_request = 10

[http]
connect_timeout_secs = 10
# A page of the measurement archive takes a few seconds, at times much longer.
timeout_secs = 180
max_attempts = 5
initial_backoff_ms = 1000

[sink]
# "local" writes under the directories below; "gcs" uses them as object prefixes in
# `gcs_bucket` (needs a binary built with `--features gcs`).
storage = "local"
gcs_bucket = ""
measurements_dir = "raw/arpae/measurements"
archive_measurements_dir = "raw/arpae/measurements_archive"
stations_dir = "raw/arpae/stations"
station_types_dir = "raw/arpae/station_types"
weather_dir = "raw/openmeteo/weather"

[run]
# Days reprocessed on every run, to pick up revisions of provisional data.
reprocess_window_days = 30

[log]
# "text" or "json"
format = "text"
