[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/http",
    "crates/source-arpae",
    "crates/source-openmeteo",
    "crates/sink-parquet",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
aq-core = { path = "crates/core" }
aq-http = { path = "crates/http" }
aq-source-arpae = { path = "crates/source-arpae" }
aq-source-openmeteo = { path = "crates/source-openmeteo" }
aq-sink-parquet = { path = "crates/sink-parquet" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
