[project]
name = "aria-er-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for the aria-er air quality platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40",
    "duckdb>=1.1",
    "pandas>=2.2",
    "altair>=5.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria_er_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Inline SQL tables of fixture rows read better on one line each.
"tests/conftest.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
