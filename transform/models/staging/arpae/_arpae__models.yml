version: 2

models:
  - name: stg_arpae__measurements
    description: >
      Near-real-time ARPAE measurements: typed, with the timestamp as a UTC timestamp and
      the concentration normalised to µg/m³. The published value and unit are kept.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, pollutant_id, measured_at_utc]
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [not_null]
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('arpae_pollutants')
                field: pollutant_id
      - name: measured_at_utc
        description: Reference time in UTC (end of the hour for hourly values, the day for daily ones).
        data_tests: [not_null]
      - name: concentration_ugm3
        description: Value in µg/m³; null when the unit is not a mass concentration.
      - name: value_original
        description: Value as published.
        data_tests: [not_null]
      - name: unit_original
        description: Unit as published.
      - name: validation_flag
        description: Source validation flag, verbatim (M / G).
      - name: raw_reftime
        description: Reference time exactly as published.

  - name: stg_arpae__measurements_historical
    description: >
      Validated measurements from the yearly archive files, aligned to the same key and
      reference-time convention as stg_arpae__measurements.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, pollutant_id, measured_at_utc]
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [not_null]
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('arpae_pollutants')
                field: pollutant_id
      - name: measured_at_utc
        description: Reference time in UTC (end of the hour for hourly values, the day for daily ones).
        data_tests: [not_null]
      - name: concentration_ugm3
        description: Value in µg/m³; null when the unit is not a mass concentration.
      - name: value_original
        description: Value as published.
        data_tests: [not_null]
      - name: unit_original
        description: Unit as published.

  - name: stg_arpae__stations
    description: >
      Latest extraction of the station registry: one row per station and pollutant
      measured there.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, pollutant_id]
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [not_null]
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests: [not_null]
      - name: station_name
        description: Station name.
        data_tests: [not_null]
      - name: municipality
        description: Municipality of the station.
      - name: province
        description: Province code.
      - name: address
        description: Street address.
      - name: altitude_m
        description: Altitude in metres.
      - name: longitude
        description: Longitude (WGS84).
      - name: latitude
        description: Latitude (WGS84).
      - name: pollutant_name
        description: Pollutant name as in the registry.
      - name: unit_original
        description: Unit of the pollutant as published.
      - name: extracted_on
        description: Date the registry was downloaded.
        data_tests: [not_null]

  - name: stg_arpae__station_types
    description: >
      Latest type of each station (traffic, background, ...) and of its area, normalised
      from the label of the ARPAE daily bulletin. The registry does not carry this.
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [unique, not_null]
      - name: bulletin_station_name
        description: Station name as written in the bulletin.
      - name: province
        description: Province code.
      - name: station_type
        description: What the station is exposed to; other covers local and mobile stations.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [traffic, background, industrial, other]
      - name: area_type
        description: Kind of area around the station; null when the label does not say.
        data_tests:
          - accepted_values:
              arguments:
                values: [urban, suburban, rural, remote]
      - name: type_label_original
        description: Label as published.
        data_tests: [not_null]
      - name: bulletin_id
        description: Bulletin (date) the label comes from.
      - name: extracted_on
        description: Date the bulletin was downloaded.
        data_tests: [not_null]
