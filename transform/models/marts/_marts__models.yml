version: 2

models:
  - name: mart_exceedances_yearly
    description: >
      How many times each station exceeded each legal limit, per calendar year. One row
      per station, pollutant, metric and year. Thresholds come from the air_quality_limits
      seed. Read exceedances together with year_coverage: a partial year undercounts.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, pollutant_id, metric, year]
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [not_null]
      - name: station_name
        description: Current station name.
      - name: municipality
        description: Municipality of the station.
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests: [not_null]
      - name: pollutant_code
        description: Short code of the pollutant.
      - name: metric
        description: Statistic the limit applies to.
        data_tests: [not_null]
      - name: year
        description: Calendar year in ARPAE local standard time.
        data_tests: [not_null]
      - name: exceedances
        description: Valid periods (days or hours) whose value, rounded to a whole number, is strictly above the limit.
        data_tests: [not_null]
      - name: limit_ugm3
        description: Threshold applied, in µg/m³.
      - name: max_exceedances_per_year
        description: Exceedances allowed by law in a year.
      - name: is_over_allowed_exceedances
        description: The station exceeded the limit more often than allowed.
      - name: max_value_ugm3
        description: Highest value of the metric in the year.
      - name: valid_periods
        description: Valid periods the count is based on.
      - name: year_coverage
        description: Valid periods over the periods of a full year.

  - name: mart_data_completeness
    description: >
      Data coverage audit: one row per station, pollutant and day between the first and
      last observation of the series, including days with no data for the station. Days on
      which no station has any value are left out: they were not loaded, or the whole
      network was down.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, pollutant_id, measurement_date]
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [not_null]
      - name: station_name
        description: Current station name.
      - name: municipality
        description: Municipality of the station.
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests: [not_null]
      - name: pollutant_code
        description: Short code of the pollutant.
      - name: measurement_date
        description: Calendar day in ARPAE local standard time.
        data_tests: [not_null]
      - name: expected_measurements
        description: Values a complete day has.
      - name: measurements
        description: Values published for the day (0 when the day is missing).
      - name: valid_measurements
        description: Values usable in aggregates.
      - name: completeness
        description: Valid values over expected values.
        data_tests: [not_null]
      - name: is_complete
        description: Completeness reaches the minimum required.

  - name: mart_weather_correlation
    description: >
      Relation between daily PM10 and weather, per station and meteorological season
      (all years together). Pearson correlation of PM10 with mean wind speed and with
      precipitation, and mean PM10 on windy vs calm and rainy vs dry days. Thresholds are
      dbt variables. Weather is a reanalysis at ~10 km, not a measurement at the station.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, season]
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [not_null]
      - name: station_name
        description: Current station name.
      - name: municipality
        description: Municipality of the station.
      - name: season
        description: Meteorological season (winter is December to February).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [winter, spring, summer, autumn]
      - name: days
        description: Days with both a valid PM10 mean and valid weather.
        data_tests: [not_null]
      - name: pm10_mean_ugm3
        description: Mean PM10 over those days, in µg/m³.
      - name: corr_pm10_wind
        description: Pearson correlation between daily PM10 and mean wind speed; null with too few days.
      - name: corr_pm10_precipitation
        description: Pearson correlation between daily PM10 and daily precipitation; null with too few days.
      - name: windy_days
        description: Days with mean wind speed at or above the windy threshold.
      - name: pm10_mean_windy_ugm3
        description: Mean PM10 on windy days.
      - name: pm10_mean_calm_ugm3
        description: Mean PM10 on the other days.
      - name: rainy_days
        description: Days with precipitation at or above the rainy threshold.
      - name: pm10_mean_rainy_ugm3
        description: Mean PM10 on rainy days.
      - name: pm10_mean_dry_ugm3
        description: Mean PM10 on the other days.

  - name: mart_pollutant_trend
    description: >
      Multi-year trend: annual mean per municipality, pollutant and year, as the average
      of the annual means of its stations. A year is representative when every station
      has at least 90% of valid days.
    data_tests:
      - unique_combination:
          arguments:
            columns: [municipality, pollutant_id, year]
    columns:
      - name: municipality
        description: Municipality of the stations.
        data_tests: [not_null]
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests: [not_null]
      - name: pollutant_code
        description: Short code of the pollutant.
      - name: year
        description: Calendar year in ARPAE local standard time.
        data_tests: [not_null]
      - name: stations
        description: Stations with data for the pollutant in the year.
      - name: annual_mean_ugm3
        description: Average of the stations' annual means, in µg/m³.
        data_tests: [not_null]
      - name: min_station_mean_ugm3
        description: Lowest annual mean among the stations.
      - name: max_station_mean_ugm3
        description: Highest annual mean among the stations.
      - name: min_year_coverage
        description: Share of valid days of the least covered station.
      - name: is_representative
        description: Every station reaches the minimum annual coverage.

  - name: mart_traffic_vs_background
    description: >
      Traffic against background stations of the same municipality: monthly means per
      pollutant over the days on which both kinds have valid data. Station types come
      from int_station_types_current.
    data_tests:
      - unique_combination:
          arguments:
            columns: [municipality, pollutant_id, month]
    columns:
      - name: municipality
        description: Municipality with both a traffic and a background station.
        data_tests: [not_null]
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests: [not_null]
      - name: pollutant_code
        description: Short code of the pollutant.
      - name: month
        description: First day of the month.
        data_tests: [not_null]
      - name: days
        description: Days with valid data for both kinds of station.
      - name: traffic_stations
        description: Traffic stations contributing.
      - name: background_stations
        description: Background stations contributing.
      - name: traffic_mean_ugm3
        description: Mean of the traffic stations, in µg/m³.
      - name: background_mean_ugm3
        description: Mean of the background stations, in µg/m³.
      - name: difference_ugm3
        description: Traffic mean minus background mean.
        data_tests: [not_null]
      - name: traffic_to_background_ratio
        description: Traffic mean over background mean.

unit_tests:
  - name: exceedances_compare_the_rounded_value_with_the_limit
    model: mart_exceedances_yearly
    description: >
      A period exceeds when its value, rounded to a whole number, is strictly greater than
      the limit, as in the ARPAE bulletins. Periods of invalid days are not counted.
    given:
      - input: ref('air_quality_limits')
        rows:
          - {pollutant_id: 5, pollutant_code: PM10, metric: daily_mean, limit_ugm3: 50, max_exceedances_per_year: 35}
      - input: ref('int_measurements_daily')
        rows:
          - {station_id: 1, pollutant_id: 5, measurement_date: 2026-01-01, daily_mean_ugm3: 50.0, is_valid_day: true}
          - {station_id: 1, pollutant_id: 5, measurement_date: 2026-01-02, daily_mean_ugm3: 50.4, is_valid_day: true}
          - {station_id: 1, pollutant_id: 5, measurement_date: 2026-01-03, daily_mean_ugm3: 50.6, is_valid_day: true}
          - {station_id: 1, pollutant_id: 5, measurement_date: 2026-01-04, daily_mean_ugm3: 62.7, is_valid_day: true}
          - {station_id: 1, pollutant_id: 5, measurement_date: 2026-01-05, daily_mean_ugm3: 90.0, is_valid_day: false}
      - input: ref('int_measurements_deduplicated')
        rows: []
      - input: ref('int_o3_8h_rolling')
        rows: []
      - input: ref('int_stations_current')
        rows: []
    expect:
      rows:
        - {station_id: 1, pollutant_id: 5, metric: daily_mean, year: 2026, exceedances: 2, valid_periods: 4, max_value_ugm3: 62.7}

  - name: completeness_grid_covers_only_loaded_days
    model: mart_data_completeness
    description: >
      A day on which no station has any value was not loaded (or the whole network was
      down) and is left out of the grid; a day missing for one station while others have
      values is kept, with completeness 0.
    given:
      - input: ref('int_measurements_daily')
        rows:
          - {station_id: 1, pollutant_id: 5, pollutant_code: PM10, expected_measurements: 1, measurement_date: 2026-01-01, measurements: 1, valid_measurements: 1, is_valid_day: true}
          - {station_id: 1, pollutant_id: 5, pollutant_code: PM10, expected_measurements: 1, measurement_date: 2026-01-03, measurements: 1, valid_measurements: 1, is_valid_day: true}
          - {station_id: 1, pollutant_id: 5, pollutant_code: PM10, expected_measurements: 1, measurement_date: 2026-01-10, measurements: 1, valid_measurements: 1, is_valid_day: true}
          - {station_id: 2, pollutant_id: 5, pollutant_code: PM10, expected_measurements: 1, measurement_date: 2026-01-01, measurements: 1, valid_measurements: 1, is_valid_day: true}
          - {station_id: 2, pollutant_id: 5, pollutant_code: PM10, expected_measurements: 1, measurement_date: 2026-01-02, measurements: 1, valid_measurements: 1, is_valid_day: true}
          - {station_id: 2, pollutant_id: 5, pollutant_code: PM10, expected_measurements: 1, measurement_date: 2026-01-10, measurements: 1, valid_measurements: 1, is_valid_day: true}
      - input: ref('int_stations_current')
        rows: []
    expect:
      rows:
        - {station_id: 1, measurement_date: 2026-01-01, completeness: 1.0}
        - {station_id: 1, measurement_date: 2026-01-02, completeness: 0.0}
        - {station_id: 1, measurement_date: 2026-01-03, completeness: 1.0}
        - {station_id: 1, measurement_date: 2026-01-10, completeness: 1.0}
        - {station_id: 2, measurement_date: 2026-01-01, completeness: 1.0}
        - {station_id: 2, measurement_date: 2026-01-02, completeness: 1.0}
        - {station_id: 2, measurement_date: 2026-01-03, completeness: 0.0}
        - {station_id: 2, measurement_date: 2026-01-10, completeness: 1.0}
