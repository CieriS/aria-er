version: 2

models:
  - name: int_stations_current
    description: >
      Current attributes of each station, from the open rows of the registry snapshot.
      Stations missing from it (local networks) get name and province from the type
      registry and no address or coordinates.
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [unique, not_null]
      - name: station_name
        description: Station name.
      - name: municipality
        description: Municipality of the station.
      - name: province
        description: Province code.
      - name: address
        description: Street address.
      - name: altitude_m
        description: Altitude in metres.
      - name: longitude
        description: Longitude (WGS84).
      - name: latitude
        description: Latitude (WGS84).
      - name: weather_location_id
        description: Weather location covering the station (rounded coordinates); null without coordinates.

  - name: int_measurements_deduplicated
    description: >
      One row per station, pollutant and reference time across the near-real-time feed and
      the validated archive (the archive wins). Incremental, reprocessing the same lookback
      window as the ingestor. Adds the averaging period, the legal day and quality flags;
      suspicious values are flagged, not removed.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, pollutant_id, measured_at_utc]
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [not_null]
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests: [not_null]
      - name: pollutant_code
        description: Short code of the pollutant.
        data_tests: [not_null]
      - name: averaging_minutes
        description: Averaging period of the value (60 or 1440).
        data_tests: [not_null]
      - name: measured_at_utc
        description: Reference time in UTC.
        data_tests: [not_null]
      - name: period_start_utc
        description: Start of the averaging period in UTC.
      - name: measurement_date
        description: Calendar day of the period in ARPAE local standard time (UTC+1).
        data_tests: [not_null]
      - name: concentration_ugm3
        description: Value in µg/m³; null when the unit is not a mass concentration.
      - name: value_original
        description: Value as published.
      - name: unit_original
        description: Unit as published.
      - name: validation_flag
        description: Validation stages of a near-real-time value, as published; null for archive rows.
      - name: source_name
        description: Origin of the row.
        data_tests:
          - accepted_values:
              arguments:
                values: [near_real_time, archive]
      - name: is_negative
        description: The concentration is below zero.
      - name: is_zero
        description: The concentration is exactly zero (possibly below the detection limit).
      - name: is_implausible
        description: The concentration is above the plausibility bound of the pollutant.
      - name: is_valid
        description: Usable in aggregates (has a concentration, not negative, not implausible).
        data_tests: [not_null]

  - name: int_measurements_daily
    description: >
      Daily statistics per station and pollutant over valid measurements, with the
      coverage of the day. A day is valid with at least 75% of the expected values.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, pollutant_id, measurement_date]
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [not_null]
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests: [not_null]
      - name: pollutant_code
        description: Short code of the pollutant.
      - name: averaging_minutes
        description: Averaging period of the underlying values.
      - name: measurement_date
        description: Calendar day in ARPAE local standard time.
        data_tests: [not_null]
      - name: daily_mean_ugm3
        description: Mean of the valid values of the day, in µg/m³.
      - name: daily_max_ugm3
        description: Highest valid value of the day, in µg/m³.
      - name: measurements
        description: Values published for the day.
      - name: valid_measurements
        description: Values of the day usable in aggregates.
      - name: expected_measurements
        description: Values a complete day has (24 hourly or 1 daily).
      - name: coverage
        description: Share of expected values that are valid.
      - name: is_valid_day
        description: Coverage reaches the minimum required.
        data_tests: [not_null]

  - name: int_o3_8h_rolling
    description: >
      Rolling 8-hour mean for pollutants with an 8-hour limit (ozone), one row per
      station and hour ending the window, for every hour between the first and the last
      day of a series, measured or not. A window is valid with at least 6 valid hours,
      whether or not the hour it ends on is one of them.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, pollutant_id, measured_at_utc]
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [not_null]
      - name: pollutant_id
        description: ARPAE parameter id.
        data_tests: [not_null]
      - name: pollutant_code
        description: Short code of the pollutant.
      - name: measured_at_utc
        description: End of the 8-hour window, in UTC.
        data_tests: [not_null]
      - name: measurement_date
        description: Day the window belongs to (the day in which it ends), local standard time.
      - name: rolling_8h_mean_ugm3
        description: Mean of the valid hourly values in the window, in µg/m³; null when it has none.
      - name: valid_hours_in_window
        description: Valid hourly values in the window (at most 8).
      - name: is_valid_window
        description: The window has at least 75% of its hours.

  - name: int_weather_daily
    description: >
      Daily weather per location in ARPAE local standard time, with the same hour-ending
      convention as the air quality data. A day is valid with at least 75% of its hours.
    data_tests:
      - unique_combination:
          arguments:
            columns: [location_id, weather_date]
    columns:
      - name: location_id
        description: Weather location (rounded coordinates).
        data_tests: [not_null]
      - name: weather_date
        description: Calendar day in ARPAE local standard time.
        data_tests: [not_null]
      - name: wind_speed_mean_ms
        description: Mean of the hourly 10 m wind speed, in m/s.
      - name: wind_speed_max_ms
        description: Highest hourly 10 m wind speed of the day, in m/s.
      - name: precipitation_mm
        description: Total precipitation of the day, in mm.
      - name: temperature_mean_c
        description: Mean 2 m temperature, in °C.
      - name: surface_pressure_mean_hpa
        description: Mean surface pressure, in hPa.
      - name: hours
        description: Hours with a wind and precipitation value.
      - name: is_valid_day
        description: The day has enough hours to be used.
        data_tests: [not_null]

  - name: int_station_types_current
    description: >
      Current type of each station. The exposure (traffic, background, industrial) comes
      from the latest snapshot of the ARPAE station registry that states it, then from the
      reference seed; the area from the latest snapshot. station_type_source says which.
    columns:
      - name: station_id
        description: Canonical station code.
        data_tests: [unique, not_null]
      - name: station_type
        description: What the station is exposed to; other when no source says.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [traffic, background, industrial, other]
      - name: area_type
        description: Kind of area around the station.
      - name: station_type_source
        description: Where the exposure comes from.
        data_tests:
          - accepted_values:
              arguments:
                values: [latest_snapshot, earlier_snapshot, reference, unknown]
      - name: type_label_original
        description: Label of the latest snapshot, as stored in raw.
      - name: bulletin_id
        description: Version (date) of the latest source record seen for the station.
      - name: extracted_on
        description: Date that snapshot was downloaded.

unit_tests:
  - name: o3_windows_exist_for_missing_hours
    model: int_o3_8h_rolling
    description: >
      Hours 00 to 08 of a day in local standard time, with the third one missing. The
      window ending on the missing hour exists, and the one ending on the ninth hour, not
      measured either, is valid with six of its eight hours. Invalid values are left out.
    overrides:
      vars:
        local_utc_offset_hours: 1
    given:
      - input: ref('air_quality_limits')
        rows:
          - {pollutant_id: 7, metric: daily_max_8h_mean}
      - input: ref('int_measurements_deduplicated')
        rows:
          - {station_id: 1, pollutant_id: 7, pollutant_code: O3, measurement_date: 2026-06-01, measured_at_utc: '2026-06-01 00:00:00', concentration_ugm3: 16, is_valid: true}
          - {station_id: 1, pollutant_id: 7, pollutant_code: O3, measurement_date: 2026-06-01, measured_at_utc: '2026-06-01 01:00:00', concentration_ugm3: 16, is_valid: true}
          - {station_id: 1, pollutant_id: 7, pollutant_code: O3, measurement_date: 2026-06-01, measured_at_utc: '2026-06-01 03:00:00', concentration_ugm3: 16, is_valid: true}
          - {station_id: 1, pollutant_id: 7, pollutant_code: O3, measurement_date: 2026-06-01, measured_at_utc: '2026-06-01 04:00:00', concentration_ugm3: 16, is_valid: true}
          - {station_id: 1, pollutant_id: 7, pollutant_code: O3, measurement_date: 2026-06-01, measured_at_utc: '2026-06-01 05:00:00', concentration_ugm3: 16, is_valid: true}
          - {station_id: 1, pollutant_id: 7, pollutant_code: O3, measurement_date: 2026-06-01, measured_at_utc: '2026-06-01 06:00:00', concentration_ugm3: 16, is_valid: true}
          - {station_id: 1, pollutant_id: 7, pollutant_code: O3, measurement_date: 2026-06-01, measured_at_utc: '2026-06-01 07:00:00', concentration_ugm3: 16, is_valid: true}
          - {station_id: 1, pollutant_id: 7, pollutant_code: O3, measurement_date: 2026-06-01, measured_at_utc: '2026-06-01 02:00:00', concentration_ugm3: -5, is_valid: false}
    expect:
      rows:
        - {measured_at_utc: '2026-06-01 00:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 1, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 01:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 2, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 02:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 2, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 03:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 3, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 04:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 4, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 05:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 5, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 06:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 6, rolling_8h_mean_ugm3: 16, is_valid_window: true}
        - {measured_at_utc: '2026-06-01 07:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 7, rolling_8h_mean_ugm3: 16, is_valid_window: true}
        - {measured_at_utc: '2026-06-01 08:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 6, rolling_8h_mean_ugm3: 16, is_valid_window: true}
        - {measured_at_utc: '2026-06-01 09:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 5, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 10:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 5, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 11:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 4, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 12:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 3, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 13:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 2, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 14:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 1, rolling_8h_mean_ugm3: 16, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 15:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 0, rolling_8h_mean_ugm3: null, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 16:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 0, rolling_8h_mean_ugm3: null, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 17:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 0, rolling_8h_mean_ugm3: null, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 18:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 0, rolling_8h_mean_ugm3: null, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 19:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 0, rolling_8h_mean_ugm3: null, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 20:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 0, rolling_8h_mean_ugm3: null, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 21:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 0, rolling_8h_mean_ugm3: null, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 22:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 0, rolling_8h_mean_ugm3: null, is_valid_window: false}
        - {measured_at_utc: '2026-06-01 23:00:00', measurement_date: 2026-06-01, valid_hours_in_window: 0, rolling_8h_mean_ugm3: null, is_valid_window: false}
