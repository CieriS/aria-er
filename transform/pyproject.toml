[project]
name = "aria-er-transform"
version = "0.1.0"
description = "dbt models for the aria-er air quality platform"
requires-python = ">=3.12,<3.13"
dependencies = ["dbt-duckdb>=1.9"]

[tool.uv]
package = false

[dependency-groups]
# Only for the BigQuery target: `uv sync --group cloud`.
cloud = ["dbt-bigquery>=1.9"]
