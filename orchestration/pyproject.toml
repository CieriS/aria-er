[project]
name = "aria-er-orchestration"
version = "0.1.0"
description = "Dagster orchestration for the aria-er air quality platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.11",
    "dagster-webserver>=1.11",
    "dagster-dbt>=0.27",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria_er_orchestration"]

[tool.dagster]
module_name = "aria_er_orchestration.definitions"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
