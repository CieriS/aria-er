version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /ingestor
    target-branch: main
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: uv
    directories: [/transform, /orchestration, /dashboard]
    target-branch: main
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    target-branch: main
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra
    target-branch: main
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
