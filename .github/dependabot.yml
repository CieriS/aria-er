version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /ingestor
    target-branch: main
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: uv
    directories: [/transform, /orchestration, /dashboard]
    target-branch: main
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    target-branch: main
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    ignore:
      # The Python projects pin 3.12 (`requires-python`): a newer minor in the image breaks
      # the virtual environment. Raise it together with the projects, by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: terraform
    directory: /infra
    target-branch: main
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
