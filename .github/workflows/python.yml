name: Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: ${{ matrix.project }} (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [orchestration, dashboard]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
