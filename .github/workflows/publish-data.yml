name: Publish data

# Runs the pipeline once a day and publishes the marts as JSON on GitHub Pages, for the
# portfolio case study (ADR 0009, contract in docs/export.md). A failed run leaves the last
# good export online.
on:
  schedule:
    # 06:30 UTC: ARPAE has published the previous day by then.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-data
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Pipeline and export
    runs-on: ubuntu-latest
    # A first run also fills up to six missing months, about five minutes each.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ingestor
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            transform/uv.lock
            orchestration/uv.lock
      # The raw layer of the previous run: only the default window and the missing months are
      # fetched again. Saved even when a later step fails, so fetched months are not lost.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Ingest
        run: make ingest
      - name: Fill the months between the archive and the daily window
        run: make fill-gaps MONTHS=6
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: raw
          key: raw-${{ github.run_id }}
      - name: Transform and test
        run: make transform
      - name: Export
        working-directory: orchestration
        run: uv run python -m aria_er_orchestration.export --duckdb ../warehouse/aria_er.duckdb --out ../site/data/v1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
